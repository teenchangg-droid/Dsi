<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f6dfbd"><link rel="manifest" href="manifest.webmanifest"><title>먼작귀의 작은 여름집</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f6ead8;color:#51483e}button,input{font:inherit}button{border:0}
#app{height:100%;position:relative;background:#f6ead8}.scene{position:absolute;inset:0;overflow:hidden;background:#d9c7a9}.bg{position:absolute;inset:0;background:url('room.jpg') center/cover no-repeat;filter:saturate(.96)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,247,230,.08),rgba(90,65,45,.08))}
.header{position:absolute;z-index:20;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;justify-content:space-between}.title,.pill{background:rgba(255,250,241,.9);border:1px solid rgba(125,103,76,.12);box-shadow:0 5px 18px rgba(60,42,25,.08);backdrop-filter:blur(8px);border-radius:18px;padding:9px 13px;font-weight:700}.title{font-size:15px}.stats{display:flex;gap:6px}.pill{font-size:12px}
.zone{position:absolute;border:1px dashed rgba(100,75,50,.12);border-radius:22px;pointer-events:none}.bed{left:31%;top:47%;width:43%;height:31%}.fridge{left:0;top:38%;width:22%;height:35%}.table{right:0;bottom:7%;width:28%;height:28%}.window{right:10%;top:12%;width:34%;height:40%}
.world{position:absolute;inset:0;z-index:5;touch-action:none}.char{position:absolute;width:86px;height:112px;transform:translate(-50%,-100%);transition:left .8s cubic-bezier(.2,.8,.25,1),top .8s cubic-bezier(.2,.8,.25,1);cursor:pointer;user-select:none;z-index:2}.char .body{position:relative;width:100%;height:100%;transform-origin:50% 88%}.char img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 8px 5px rgba(55,40,25,.18));transform-origin:50% 82%}.char.idle .body{animation:idleBreath 2.2s ease-in-out infinite}.char.walk .body{animation:walk4 .42s ease-in-out infinite}.char.talk .body{animation:talkBounce .55s ease-in-out infinite}.char.eat .body{animation:eat4 .52s ease-in-out infinite}.char.wash .body{animation:washBob .6s ease-in-out infinite}.char.play .body{animation:playHop .42s ease-in-out infinite}.char.sleep .body{animation:sleepBreath 2.6s ease-in-out infinite;transform:scale(.82) translateY(8px)}.char.sleep img{filter:drop-shadow(0 4px 3px rgba(55,40,25,.12));opacity:.94}.char .fx{position:absolute;left:50%;top:2px;transform:translateX(-50%);pointer-events:none;white-space:nowrap}.char .foodFx{font-size:21px;animation:foodFloat .6s ease-in-out infinite alternate}.char .soapFx{font-size:18px;animation:bubbles 1s ease-in-out infinite}.char .playFx{font-size:22px;animation:ballBounce .5s ease-in-out infinite}.char .heartFx{font-size:17px;animation:heartFloat 1s ease-out forwards}.char .sleepFx{font-size:20px;left:70%;top:-18px;animation:zzzFloat 1.5s ease-in-out infinite}.char .talkFx{font-size:15px;top:-10px;animation:dots 1s steps(3,end) infinite}.char .name{position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:rgba(255,252,246,.9);padding:3px 8px;border-radius:10px;font-size:10px;white-space:nowrap;opacity:0;transition:.2s}.char.sel .name{opacity:1}.bubble{position:absolute;left:50%;top:-62px;transform:translateX(-50%);background:#fffaf3;border-radius:14px;padding:6px 9px;font-size:11px;white-space:nowrap;box-shadow:0 4px 12px rgba(50,35,20,.12);animation:pop .2s ease-out}.zzz{position:absolute;left:68%;top:-35px;font-weight:800;color:#6e89b7;animation:float 1.4s infinite}.food{position:absolute;left:50%;top:-38px;transform:translateX(-50%);font-size:23px;animation:float .6s infinite alternate}
.controls{position:absolute;z-index:30;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.action{min-width:0;background:rgba(255,251,244,.94);border:1px solid rgba(125,103,76,.12);box-shadow:0 5px 16px rgba(50,35,20,.1);border-radius:18px;padding:9px 3px 8px;color:#574b40;font-size:11px;font-weight:700}.action span{display:block;font-size:20px;margin-bottom:2px}.action:active{transform:translateY(1px);background:#fff1dd}
.character-panel{position:absolute;z-index:31;top:62px;left:10px;background:rgba(255,251,244,.94);border-radius:18px;padding:8px;box-shadow:0 6px 18px rgba(50,35,20,.1);display:flex;gap:5px}.who{padding:6px 8px;border-radius:12px;background:transparent;font-size:11px}.who.on{background:#f8dfc9}.who b{display:block}.mini{font-size:17px}
.chat{position:absolute;z-index:60;left:8px;right:8px;bottom:8px;max-height:58%;background:rgba(255,251,245,.98);border:1px solid rgba(110,85,55,.12);border-radius:24px;box-shadow:0 12px 40px rgba(40,25,15,.2);display:none;flex-direction:column;overflow:hidden}.chat.open{display:flex}.chat-head{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee1d0;font-weight:800}.messages{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:150px}.msg{max-width:82%;padding:8px 11px;border-radius:14px;font-size:13px;line-height:1.35}.msg.me{align-self:flex-end;background:#f5d8cf}.msg.char{align-self:flex-start;background:#f4ecdf;position:static;width:auto;height:auto;transform:none;transition:none}.composer{display:flex;gap:7px;padding:9px;border-top:1px solid #eee1d0}.composer input{flex:1;border:1px solid #e3d4c0;border-radius:16px;padding:10px 12px;outline:0;background:#fff}.send{width:42px;border-radius:15px;background:#eab7aa;font-weight:800}
.toast{position:absolute;z-index:50;left:50%;top:48%;transform:translate(-50%,-50%);background:rgba(66,52,40,.9);color:white;padding:9px 14px;border-radius:15px;font-size:12px;opacity:0;pointer-events:none}.toast.show{animation:toast 1.6s ease both}.wind{position:absolute;z-index:8;right:17%;top:36%;font-size:30px;opacity:0}.wind.on{animation:wind 1.3s infinite}
@keyframes idleBreath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.015,.99)}}@keyframes walk4{0%{transform:translateY(0) rotate(-2deg) scaleX(.98)}25%{transform:translateY(-5px) rotate(2deg) scaleX(1.01)}50%{transform:translateY(0) rotate(-2deg) scaleX(.98)}75%{transform:translateY(-5px) rotate(2deg) scaleX(1.01)}100%{transform:translateY(0) rotate(-2deg) scaleX(.98)}}@keyframes talkBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes eat4{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(5px) rotate(-3deg)}60%{transform:translateY(2px) rotate(3deg)}}@keyframes washBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) scale(.98)}}@keyframes playHop{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(3deg)}}@keyframes sleepBreath{0%,100%{transform:scale(.82) translateY(8px)}50%{transform:scale(.84,.80) translateY(6px)}}@keyframes foodFloat{to{transform:translate(-50%,-7px) rotate(-5deg)}}@keyframes bubbles{0%{opacity:.3;transform:translate(-50%,3px) scale(.8)}50%{opacity:1;transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-17px) scale(1.15)}}@keyframes ballBounce{0%,100%{transform:translate(-50%,0) rotate(0)}50%{transform:translate(-50%,-14px) rotate(12deg)}}@keyframes heartFloat{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-28px) scale(1.15)}}@keyframes zzzFloat{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:1;transform:translateY(-7px)}}@keyframes dots{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes toast{0%{opacity:0;transform:translate(-50%,-45%)}15%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-55%)}}@keyframes wind{0%{opacity:0;transform:translateX(0)}30%{opacity:.8}100%{opacity:0;transform:translateX(-80px)}}
@media(min-width:700px){.scene{max-width:430px;margin:auto;box-shadow:0 0 45px rgba(0,0,0,.15)}.header,.controls{max-width:410px;margin:auto}.character-panel{left:calc(50% - 205px)}.chat{max-width:410px;margin:auto}}
</style></head><body><div id="app"><div class="scene"><div class="bg"></div><div class="shade"></div><div class="header"><div class="title">🌿 먼작귀의 작은 여름집</div><div class="stats"><div class="pill" id="time">☀️ 오후 3:00</div><div class="pill">💗 <span id="love">72</span></div></div></div>
<div class="character-panel"><button class="who on" data-id="chii"><span class="mini">🐻</span><b>치이카와</b></button><button class="who" data-id="hachi"><span class="mini">🐱</span><b>하치와레</b></button><button class="who" data-id="usagi"><span class="mini">🐰</span><b>우사기</b></button></div>
<div class="zone bed"></div><div class="zone fridge"></div><div class="zone table"></div><div class="zone window"></div><div class="wind" id="wind">〰️</div>
<div class="world" id="world"><div class="char sel idle" id="chii" data-id="chii"><div class="body"><img src="chii.png"><div class="fx"></div></div><div class="name">치이카와</div></div><div class="char idle" id="hachi" data-id="hachi"><div class="body"><img src="hachi.png"><div class="fx"></div></div><div class="name">하치와레</div></div><div class="char idle" id="usagi" data-id="usagi"><div class="body"><img src="usagi.png"><div class="fx"></div></div><div class="name">우사기</div></div></div>
<div class="controls"><button class="action" data-act="chat"><span>💬</span>대화</button><button class="action" data-act="feed"><span>🍉</span>밥 주기</button><button class="action" data-act="wash"><span>🫧</span>씻기</button><button class="action" data-act="play"><span>🧸</span>놀아주기</button><button class="action" data-act="sleep"><span>🛏️</span>재우기</button><button class="action" data-act="fan"><span>🌀</span>선풍기</button></div>
<div class="toast" id="toast"></div><div class="chat" id="chat"><div class="chat-head"><span id="chatname">치이카와</span><button id="close">✕</button></div><div class="messages" id="messages"></div><div class="composer"><input id="input" placeholder="자연스럽게 말을 걸어봐…"><button class="send" id="send">➤</button></div></div>
</div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s); const chars={chii:{name:'치이카와',el:$('#chii'),x:38,y:68,home:[38,68],hungry:42,love:72},hachi:{name:'하치와레',el:$('#hachi'),x:62,y:67,home:[62,67],hungry:30,love:64},usagi:{name:'우사기',el:$('#usagi'),x:48,y:57,home:[48,57],hungry:55,love:81}}; let selected='chii', moving=false, minute=15*60;
function place(c){c.el.style.left=c.x+'%';c.el.style.top=c.y+'%'} Object.values(chars).forEach(place);
function select(id){selected=id; $$('.who').forEach(b=>b.classList.toggle('on',b.dataset.id===id)); Object.values(chars).forEach(c=>c.el.classList.remove('sel')); chars[id].el.classList.add('sel'); $('#chatname').textContent=chars[id].name}
$$('.who').forEach(b=>b.onclick=e=>{e.stopPropagation();select(b.dataset.id)});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function setState(id,state,ms=0,fx=''){const c=chars[id];c.el.classList.remove('idle','walk','talk','eat','wash','play','sleep');c.el.classList.add(state);const f=c.el.querySelector('.fx');f.innerHTML=fx||'';clearTimeout(c.stateTimer);if(ms){c.stateTimer=setTimeout(()=>{c.el.classList.remove(state);c.el.classList.add('idle');f.innerHTML=''},ms)}}
function move(id,x,y,state='walk',ms=950){const c=chars[id];c.x=Math.max(8,Math.min(92,x));c.y=Math.max(28,Math.min(86,y));setState(id,state,ms);place(c)}
function bubble(id,text,extra=''){const c=chars[id];const old=c.el.querySelector('.bubble');if(old)old.remove();const b=document.createElement('div');b.className='bubble';b.textContent=text;c.el.appendChild(b);if(extra){const f=document.createElement('div');f.className=extra;c.el.appendChild(f)}setTimeout(()=>b.remove(),2300)}
function action(a){const c=chars[selected];if(a==='chat'){openChat();return}if(a==='feed'){move(selected,18,66,'walk',800);setTimeout(()=>{setState(selected,'eat',4200,'🍉');bubble(selected,'냠냠…!');},850);c.hungry=Math.max(0,c.hungry-35);c.love++;toast(c.name+'가 맛있게 먹고 있어 🍉');return}if(a==='wash'){move(selected,79,61,'walk',850);setTimeout(()=>{setState(selected,'wash',4200,'🫧 🫧');bubble(selected,'뽀득뽀득!');},900);toast('욕실로 가는 중 🫧');return}if(a==='play'){const tx=52+Math.random()*22,ty=50+Math.random()*17;move(selected,tx,ty,'walk',900);setTimeout(()=>{setState(selected,'play',4200,'🏐');bubble(selected,selected==='usagi'?'신난다!!':'재밌다!');c.love++;},950);toast('같이 놀러 가는 중 🧸');return}if(a==='sleep'){move(selected,48,70,'walk',900);setTimeout(()=>{setState(selected,'sleep',7000,'💤');bubble(selected,'잘 자…');},950);toast(c.name+'가 침대로 가고 있어 😴');return}if(a==='fan'){const on=$('#wind').classList.toggle('on');toast(on?'선풍기를 켰어 🌬️':'선풍기를 껐어');if(on){Object.keys(chars).forEach((id,i)=>{setState(id,'talk',1100,'〰️');move(id,chars[id].x+(i===0?3:-2),chars[id].y,'walk',1000)});}}}
$$('.action').forEach(b=>b.onclick=()=>action(b.dataset.act));
$('#world').addEventListener('pointerdown',e=>{if(e.target.closest('.char')){select(e.target.closest('.char').dataset.id);return} const r=$('#world').getBoundingClientRect();move(selected,(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100,'walk')});
function openChat(){ $('#chat').classList.add('open'); const m=$('#messages'); if(!m.children.length)addMsg('char',chars[selected].name,'오늘 뭐 하고 놀까…?'); setTimeout(()=>$('#input').focus(),50)} $('#close').onclick=()=>$('#chat').classList.remove('open');
function addMsg(who,name,text){const d=document.createElement('div');d.className='msg '+who;d.textContent=(who==='char'?name+'  ':'')+text;$('#messages').appendChild(d);$('#messages').scrollTop=99999}
function reply(t){const id=selected,n=chars[id].name;let r='';if(/수박|먹|배고/.test(t))r=id==='usagi'?'수박! 수박 더 먹자!!':'응… 같이 먹자! 🍉';else if(/뭐해|뭐 하|놀/.test(t))r=id==='hachi'?'책 읽고 있었어! 같이 볼래?':'그냥 쉬고 있었어…';else if(/자|졸|잠/.test(t))r='조금 졸려… 같이 낮잠 잘래?';else if(/좋아|사랑|귀여/.test(t))r=id==='usagi'?'헤헤! 당연하지!':'나도 좋아…!';else r=id==='hachi'?'응! 무슨 이야기 할까?':'응… 듣고 있어!';addMsg('char',n,r);setState(id,'talk',1500,'💗');bubble(id,r);chars[id].love++;$('#love').textContent=Math.max(...Object.values(chars).map(c=>c.love))}
function send(){const v=$('#input').value.trim();if(!v)return;addMsg('me','',v);$('#input').value='';setTimeout(()=>reply(v),500)} $('#send').onclick=send;$('#input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
function wander(){if($('#chat').classList.contains('open'))return;Object.entries(chars).forEach(([id,c])=>{if(c.el.classList.contains('sleep')||c.el.classList.contains('eat')||c.el.classList.contains('wash')||c.el.classList.contains('play'))return;if(Math.random()<.68){const pts=[[22,65],[35,55],[52,55],[68,58],[78,65],[45,78],[62,76]];const p=pts[Math.floor(Math.random()*pts.length)];move(id,p[0]+(Math.random()*8-4),p[1]+(Math.random()*6-3),'walk',1000);if(Math.random()<.2)setTimeout(()=>bubble(id,id==='usagi'?'우라!':'흐음…'),1050)}})}
setInterval(wander,4200);setInterval(()=>{minute+=1;const h=Math.floor(minute/60)%24,m=minute%60;$('#time').textContent=(h<18?'☀️':'🌙')+' '+(h<12?'오전':'오후')+' '+(h%12||12)+':'+String(m).padStart(2,'0')},3000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
