.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,248,228,.05),transparent 45%,rgba(53,37,20,.10));pointer-events:none}
.top{position:absolute;z-index:20;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start}
.paper{background:rgba(255,249,236,.84);backdrop-filter:blur(8px);border:1px solid rgba(102,76,51,.13);box-shadow:0 4px 14px rgba(60,40,20,.12)}
.title{padding:8px 12px;border-radius:16px;font-family:"Gowun Batang",serif;font-weight:700;font-size:12px}
.stats{display:flex;gap:5px}.stat{padding:7px 9px;border-radius:15px;font-size:10px}
.weather{position:absolute;z-index:8;right:7%;top:18%;font-size:11px;color:rgba(91,77,66,.75);background:rgba(255,250,240,.55);padding:5px 9px;border-radius:999px}
.wind{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.wind i{position:absolute;width:75px;height:2px;border-radius:50%;background:rgba(255,255,255,.42);opacity:0}
.wind.on i{animation:wind 4.5s linear infinite;animation-delay:var(--d)}
@keyframes wind{0%{transform:translateX(-120px) translateY(0);opacity:0}15%{opacity:.45}65%{opacity:.35}100%{transform:translateX(120vw) translateY(var(--y));opacity:0}}
.leaf{position:absolute;z-index:7;font-size:13px;opacity:0;pointer-events:none}
.wind.on~.leaf{animation:leaf 3.8s linear infinite}
@keyframes leaf{0%{transform:translate(-30px,0) rotate(0);opacity:0}18%{opacity:.6}100%{transform:translate(110vw,var(--drift)) rotate(360deg);opacity:0}}
.fan{position:absolute;z-index:12;left:18%;top:36%;width:23%;height:22%;background:transparent;border-radius:50%}
.fan-mark{position:absolute;left:26%;top:40%;z-index:13;opacity:.45;font-size:13px;pointer-events:none}
.fan-badge{position:absolute;z-index:14;left:50%;top:33%;transform:translateX(-50%);background:rgba(68,86,78,.86);color:#fff;border-radius:999px;padding:6px 10px;font-size:10px;opacity:0;transition:.25s;pointer-events:none}
.fan-badge.show{opacity:1}
.curtain{position:absolute;z-index:5;right:0;top:17%;width:29%;height:47%;pointer-events:none;background:rgba(255,255,255,.09);clip-path:polygon(18% 0,100% 4%,86% 100%,0 91%);opacity:.4}
.wind.on~.curtain{animation:curtain 2.6s ease-in-out infinite}
@keyframes curtain{50%{transform:translateX(-10px) skewX(-2deg)}}
.char{position:absolute;z-index:15;width:72px;height:84px;touch-action:none;user-select:none;transition:filter .3s}
.char .body{position:absolute;left:11px;top:13px;width:50px;height:54px;border-radius:48% 48% 42% 42%;box-shadow:0 5px 9px rgba(70,45,25,.14);border:2px solid rgba(90,68,48,.15)}
.char .face{position:absolute;left:19px;top:30px;z-index:2;font-size:22px;letter-spacing:2px}
.char .name{position:absolute;left:50%;top:69px;transform:translateX(-50%);white-space:nowrap;font-size:9px;background:rgba(255,250,240,.86);padding:3px 7px;border-radius:999px;opacity:0;transition:.2s}
.char.selected .name{opacity:1}
.chi .body{background:#fff4e6}.chi .face:before{content:"•  •";letter-spacing:5px;font-size:12px}.chi .face:after{content:"⌣";display:block;text-align:center;font-size:14px;margin-top:-1px}
.hachi .body{background:#f2cfaa}.hachi .face:before{content:"•  •";letter-spacing:5px;font-size:12px}.hachi .face:after{content:"⌣";display:block;text-align:center;font-size:14px}
.usa .body{background:#ead2bb}.usa .face:before{content:"•  •";letter-spacing:5px;font-size:12px}.usa .face:after{content:"▽";display:block;text-align:center;font-size:12px}
.char .ear{position:absolute;z-index:0;width:22px;height:34px;background:inherit;border:2px solid rgba(90,68,48,.15);border-radius:60% 60% 35% 35%}
.chi .ear,.hachi .ear{display:none}.usa .ear.l{left:12px;top:0;transform:rotate(-18deg)}.usa .ear.r{right:12px;top:0;transform:rotate(18deg)}
.char.walk{animation:step .42s ease-in-out infinite alternate}
@keyframes step{to{transform:translateY(-3px) rotate(1.5deg)}}
.char.sleeping{filter:brightness(.8);animation:sleep .9s ease-in-out infinite}
@keyframes sleep{50%{transform:translateY(2px)}}
.char .bubble{position:absolute;z-index:4;left:50%;bottom:82px;transform:translateX(-50%);width:max-content;max-width:150px;background:#fffaf0;border:1px solid rgba(100,75,50,.12);border-radius:14px;padding:7px 9px;font-size:10px;box-shadow:0 4px 12px rgba(50,35,20,.13);opacity:0;transition:.2s;pointer-events:none}
.char .bubble.show{opacity:1}
.char .fur{position:absolute;z-index:5;left:57px;top:24px;font-size:11px;opacity:0}
.wind.on~.char .fur{opacity:.65;animation:fur .7s ease-in-out infinite alternate}
@keyframes fur{to{transform:translateX(7px) rotate(-5deg)}}
.interact{position:absolute;z-index:10;width:45px;height:45px;border-radius:50%;background:transparent}
#windowHot{right:2%;top:22%;width:32%;height:34%}
#fridgeHot{left:73%;top:45%;width:20%;height:24%}
#bathHot{right:1%;bottom:22%;width:22%;height:24%}
#bookHot{left:3%;bottom:19%;width:24%;height:22%}
.bottom{position:absolute;z-index:30;left:0;right:0;bottom:0;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(transparent,rgba(47,33,20,.45))}
.menu{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.menu button{min-width:0;border-radius:16px;background:rgba(255,249,237,.92);color:#5b4d42;padding:7px 2px;font-size:9px;font-weight:700;box-shadow:0 4px 12px rgba(40,27,16,.15)}
.menu button:active{transform:scale(.94)}.ico{display:block;font-size:19px;line-height:20px}
.sheet{position:absolute;z-index:50;left:0;right:0;bottom:0;background:#fffaf0;border-radius:24px 24px 0 0;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -10px 30px rgba(40,28,17,.2);transform:translateY(110%);transition:.25s}
.sheet.open{transform:translateY(0)}
.grab{width:36px;height:4px;border-radius:8px;background:#d5c5b0;margin:0 auto 10px}
h2{font:700 18px "Gowun Batang",serif;margin:0 0 4px}p{font-size:12px;color:#7d6e62;margin:4px 0 9px}.dialog{background:#f3e8d6;border-radius:16px;padding:10px;font-size:13px;line-height:1.55;margin-bottom:8px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice,.close{border-radius:13px;padding:10px;background:#ead7bc;color:#5c4b3e;font-size:11px;font-weight:700}.close{width:100%;margin-top:7px;background:#e1c8a7}
.toast{position:absolute;z-index:60;left:50%;bottom:19%;transform:translateX(-50%) translateY(12px);background:rgba(58,45,35,.9);color:white;border-radius:17px;padding:9px 13px;font-size:11px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ripple{position:absolute;z-index:40;width:12px;height:12px;border:2px solid rgba(255,255,255,.75);border-radius:50%;animation:ripple .7s ease-out forwards;pointer-events:none}@keyframes ripple{to{width:70px;height:70px;opacity:0;transform:translate(-29px,-29px)}}
@media(min-width:700px){.char{transform:scale(1.15)}.menu button{font-size:11px}}

/* v2 life-sim layer */
#stageTap{position:absolute;inset:13% 0 15%;z-index:5;pointer-events:auto}
.char{z-index:12;transition:left 1.8s cubic-bezier(.2,.75,.25,1),top 1.8s cubic-bezier(.2,.75,.25,1),transform .2s}
.char.walking{animation:step .42s infinite alternate}
@keyframes step{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.char.selected{filter:drop-shadow(0 5px 5px rgba(87,62,40,.22));}
.char.selected .name{background:#fff8e8}
.char.sleeping{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(2px) scaleY(.96)}}
.status-card{position:absolute;z-index:31;left:10px;top:70px;width:145px;background:rgba(255,250,239,.9);backdrop-filter:blur(8px);border:1px solid rgba(126,99,70,.12);border-radius:16px;padding:8px;box-shadow:0 5px 16px rgba(53,37,23,.12)}
.status-name{font-family:"Gowun Batang";font-weight:700;font-size:12px;margin-bottom:5px}
.mini-row{display:flex;align-items:center;gap:5px;font-size:9px;margin:3px 0}
.bar{height:6px;flex:1;background:#e8ddce;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:70%;background:#c99b75;border-radius:99px;transition:width .3s}
.quest{position:absolute;z-index:31;right:10px;top:70px;background:rgba(255,250,239,.92);border-radius:16px;padding:8px 10px;font-size:9px;box-shadow:0 5px 16px rgba(53,37,23,.12);max-width:145px}
.quest b{display:block;font-family:"Gowun Batang";font-size:11px;margin-bottom:3px}
.event{position:absolute;z-index:35;left:50%;top:18%;transform:translate(-50%,-10px);opacity:0;pointer-events:none;background:#fff9ec;border:1px solid #e4cfad;border-radius:20px;padding:8px 13px;box-shadow:0 8px 20px rgba(50,35,20,.15);font-size:11px;transition:.35s;white-space:nowrap}
.event.show{opacity:1;transform:translate(-50%,0)}
.time-pill{position:absolute;z-index:31;left:50%;top:12px;transform:translateX(-50%);background:rgba(255,249,235,.88);padding:5px 10px;border-radius:99px;font-size:10px;box-shadow:0 3px 10px rgba(50,35,20,.1)}
.collection{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:7px}
.item{background:#f1e2ca;border-radius:13px;padding:8px 3px;text-align:center;font-size:9px}
.item b{display:block;font-size:20px}
.big-choice{width:100%;border-radius:14px;background:#ead7bc;padding:11px;margin-top:6px;text-align:left;font-size:11px}
.big-choice:active{transform:scale(.98)}
@media(max-width:380px){.status-card{width:132px}.quest{max-width:128px}.time-pill{top:11px}}
</style>
</head>
<body>
<div id="game">
<div class="scene"></div>
<div class="top"><div class="paper title">🌿 먼작귀의 작은 여름집</div><div class="stats"><div class="paper stat">💗 <b id="love">72</b></div><div class="paper stat">🪙 <b id="coin">320</b></div></div></div>
<div class="weather" id="weather">☀️ 여름 오후 · 바람 2m/s</div>
<div class="time-pill" id="timePill">☀️ 오후 3:00</div>
<div class="status-card">
  <div class="status-name" id="statusName">치이카와의 오늘</div>
  <div class="mini-row">🍚 배 <span class="bar"><i id="hungerBar"></i></span></div>
  <div class="mini-row">💤 피로 <span class="bar"><i id="energyBar"></i></span></div>
  <div class="mini-row">🫧 청결 <span class="bar"><i id="cleanBar"></i></span></div>
</div>
<div class="quest" id="quest"><b>오늘의 작은 부탁</b><span id="questText">셋 중 한 명과 대화하기</span></div>
<div class="event" id="event"></div>
<div id="stageTap"></div>

<div class="wind" id="wind">
<i style="left:-10%;top:28%;--d:0s;--y:9px"></i><i style="left:-5%;top:39%;--d:1.3s;--y:-6px"></i><i style="left:-15%;top:54%;--d:2.2s;--y:8px"></i><i style="left:-8%;top:68%;--d:.6s;--y:-8px"></i>
</div>
<div class="leaf">🍃</div><div class="curtain"></div>
<button class="fan" id="fan" aria-label="선풍기"></button><div class="fan-mark">🌀</div><div class="fan-badge" id="fanBadge">🌀 선풍기를 켰어요 · 바람이 솔솔</div>

<button class="interact" id="windowHot" aria-label="창문"></button>
<button class="interact" id="fridgeHot" aria-label="냉장고"></button>
<button class="interact" id="bathHot" aria-label="욕실"></button>
<button class="interact" id="bookHot" aria-label="책"></button>

<div class="char chi" id="chi" style="left:36%;top:54%" data-name="치이카와"><div class="ear l"></div><div class="ear r"></div><div class="body"></div><div class="face"></div><div class="fur">〰</div><div class="name">치이카와</div><div class="bubble"></div></div>
<div class="char hachi" id="hachi" style="left:9%;top:47%" data-name="하치와레"><div class="body"></div><div class="face"></div><div class="fur">〰</div><div class="name">하치와레</div><div class="bubble"></div></div>
<div class="char usa" id="usa" style="left:68%;top:55%" data-name="우사기"><div class="ear l"></div><div class="ear r"></div><div class="body"></div><div class="face"></div><div class="fur">〰</div><div class="name">우사기</div><div class="bubble"></div></div>

<div class="bottom"><div class="menu">
<button onclick="openPanel('talk')"><span class="ico">🌿</span>대화하기</button>
<button onclick="openPanel('food')"><span class="ico">🍙</span>밥 주기</button>
<button onclick="openPanel('bath')"><span class="ico">🫧</span>씻겨주기</button>
<button onclick="openPanel('play')"><span class="ico">🧸</span>놀아주기</button>
<button onclick="sleepSelected()"><span class="ico">🛏️</span><span id="sleepLabel">재우기</span></button>
<button onclick="toggleFan()"><span class="ico">🌀</span><span id="fanLabel">선풍기</span></button>
<button onclick="openPanel('diary')"><span class="ico">📖</span>일기</button>
<button onclick="openPanel('bag')"><span class="ico">🧺</span>소지품</button>
</div></div>

<section class="sheet" id="sheet"><div class="grab"></div><h2 id="sheetTitle">치이카와와 대화하기</h2><p id="sheetDesc">무슨 이야기를 해볼까요?</p><div class="dialog" id="dialog">「오늘은 뭐 하고 놀까?」</div><div class="choices" id="choices"></div><button class="close" onclick="closePanel()">닫기</button></section>
<div class="toast" id="toast"></div>
</div>
<script>
const saveKey="chiikawaSummerPWA_v2";
const defaults={
 love:72,coin:320,day:1,minutes:900,selected:"치이카와",
 chars:{
  "치이카와":{hunger:72,energy:82,clean:78,spot:["36%","54%"]},
  "하치와레":{hunger:64,energy:88,clean:84,spot:["9%","47%"]},
  "우사기":{hunger:80,energy:75,clean:70,spot:["68%","55%"]}
 },
 items:{🍙:2,"🍉":1,"🍮":1,"🧸":1}, quest:0
};
let state=JSON.parse(localStorage.getItem(saveKey)||"null")||defaults;
let selected=state.selected||"치이카와",fan=false, moving=false, sleeping={};
const $=id=>document.getElementById(id);
const data={
"치이카와":{talk:["「왔어? 기다리고 있었어…」","「오늘은 같이 낮잠 잘까?」","「창문에서 바람 냄새가 나…」"],food:["「우와! 맛있겠다!」","「냠냠… 맛있어!」","「배가 따뜻해졌어…」"],bath:["「따뜻하다…」","「기분 좋아…」","「뽀송뽀송해졌어!」"],play:["「같이 놀자!」","「한 번 더 하자!」"]},
"하치와레":{talk:["「어서 와!」","「여름에는 수박이지!」","「오늘 좋은 일이 생길 것 같아!」"],food:["「우와아!」","「냠냠! 맛있다!」","「배부르다~」"],bath:["「목욕 시간이다!」","「따뜻해서 좋다~」","「완전 뽀송해졌어!」"],play:["「신난다!」","「이번에는 내가 이길 거야!」"]},
"우사기":{talk:["「야아!」","「우우야아!」","「……？」"],food:["「와하!」","「냠!」","「하아아…」"],bath:["「야아아!」","「우우…」","「후우…」"],play:["「와하!」","「얏호!」"]}
};
const spots={
"치이카와":[["36%","54%"],["50%","62%"],["42%","46%"],["30%","60%"]],
"하치와레":[["9%","47%"],["20%","58%"],["12%","62%"],["28%","52%"]],
"우사기":[["68%","55%"],["58%","61%"],["75%","58%"],["63%","47%"]]
};
function save(){state.selected=selected;localStorage.setItem(saveKey,JSON.stringify(state));updateUI()}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.remove("show"),1600)}
function eventMsg(t){$("event").textContent=t;$("event").classList.add("show");clearTimeout(window.et);window.et=setTimeout(()=>$("event").classList.remove("show"),2400)}
function bubble(name,text){const el=[...document.querySelectorAll(".char")].find(x=>x.dataset.name===name);if(!el)return;const b=el.querySelector(".bubble");b.textContent=text;b.classList.add("show");setTimeout(()=>b.classList.remove("show"),2100)}
function selectChar(name){selected=name;document.querySelectorAll(".char").forEach(c=>c.classList.toggle("selected",c.dataset.name===name));updateUI()}
document.querySelectorAll(".char").forEach(c=>c.addEventListener("click",e=>{e.stopPropagation();selectChar(c.dataset.name);bubble(c.dataset.name,["치이카와","하치와레","우사기"].includes(c.dataset.name)?"나랑 놀아줄 거야?":"…")}))

function moveChar(name,x,y,cb){
 const c=[...document.querySelectorAll(".char")].find(x=>x.dataset.name===name); if(!c||sleeping[name])return;
 c.classList.add("walking");c.style.left=x;c.style.top=y;state.chars[name].spot=[x,y];
 clearTimeout(c._walk);c._walk=setTimeout(()=>{c.classList.remove("walking");if(cb)cb()},1900);
}
function playerMove(e){
 if(e.target.closest("button,.sheet,.bottom,.char,.status-card,.quest,.event,.fan,.interact"))return;
 const r=$("stageTap").getBoundingClientRect();
 const x=Math.max(3,Math.min(88,((e.clientX-r.left)/r.width*100)-4));
 const y=Math.max(24,Math.min(74,((e.clientY-r.top)/r.height*100)-4));
 moveChar(selected,x+"%",y+"%");
 bubble(selected,"총총…");
}
$("stageTap").addEventListener("pointerdown",playerMove);

function updateUI(){
 const s=state.chars[selected]; $("love").textContent=state.love;$("coin").textContent=state.coin;
 $("statusName").textContent=selected+"의 오늘";
 $("hungerBar").style.width=s.hunger+"%";$("energyBar").style.width=s.energy+"%";$("cleanBar").style.width=s.clean+"%";
 const h=Math.floor(state.minutes/60),m=String(state.minutes%60).padStart(2,"0");
 $("timePill").textContent=(h<6||h>=19?"🌙":"☀️")+" "+(h<6?"밤":h<10?"아침":h<12?"늦은 아침":h<14?"점심":h<18?"오후":"저녁")+" "+h+":"+m;
 const q=["셋 중 한 명과 대화하기","누군가에게 간식 주기","창문을 열어 바람 쐬기","같이 놀아주기"][state.quest%4];
 $("questText").textContent=q;
}
function tick(){
 state.minutes+=5;
 if(state.minutes>=1440){state.minutes=0;state.day++;state.quest=0;eventMsg("새로운 여름날이 시작됐어요 ☀️")}
 Object.values(state.chars).forEach(s=>{s.hunger=Math.max(0,s.hunger-.35);s.clean=Math.max(0,s.clean-.12);if(!Object.values(sleeping).some(Boolean))s.energy=Math.max(0,s.energy-.08)});
 if(Math.random()<.025){const n=["치이카와","하치와레","우사기"][Math.floor(Math.random()*3)];bubble(n,["「수박 먹고 싶어…」","「선풍기 바람 시원하다~」","「와하!」"][Math.floor(Math.random()*3)])}
 save();
}
setInterval(tick,5000);

function openPanel(type){
 const d=data[selected];let title="",desc="",choices=[];
 if(type==="talk"){title=selected+"와 대화하기";desc="오늘 있었던 일을 들려줘요.";choices=[["오늘 뭐 했어?",()=>act(d.talk[1],3)],["같이 있자!",()=>act(d.talk[2],5)],["칭찬해주기 💗",()=>act("「헤헤…」",7)]]}
 if(type==="food"){title=selected+"에게 밥 주기";desc="가지고 있는 간식을 골라요.";choices=[["🍙 주먹밥 · 10코인",()=>eat("🍙",10,d.food[0],6)],["🍉 수박 · 12코인",()=>eat("🍉",12,d.food[1],7)],["🍮 푸딩 · 15코인",()=>eat("🍮",15,d.food[2],9)]]}
 if(type==="bath"){title=selected+" 씻겨주기";desc="물놀이하고 뽀송하게 말려줘요.";choices=[["🫧 목욕시키기",()=>act(d.bath[1],5)],["🧺 수건으로 닦기",()=>{state.chars[selected].clean=Math.min(100,state.chars[selected].clean+15);act(d.bath[2],4)}]]}
 if(type==="play"){title=selected+"와 놀아주기";desc="작은 여름집에서 같이 놀아요.";choices=[["🧸 인형 놀이",()=>play(d.play[0],6)],["🎈 쫓아가기",()=>play(d.play[1],7)],["🍃 바람 놀이",()=>play("「와아, 바람이다!」",8)]]}
 if(type==="diary"){title="오늘의 여름집 일기";desc="오늘의 작은 기억을 남겨요.";choices=[["✏️ 일기 쓰기",()=>{eventMsg("“오늘도 셋이서 한참 웃었다.”");state.love=Math.min(100,state.love+2);save();closePanel()}],["🌅 저녁 풍경 보기",()=>{eventMsg("노을빛이 방 안으로 들어왔어요.");closePanel()}]]}
 if(type==="bag"){title="작은 여름집 소지품";desc="지금 가지고 있는 것들이에요.";$("dialog").innerHTML='<div class="collection"><div class="item"><b>🍙</b>주먹밥<br>'+state.items["🍙"]+'개</div><div class="item"><b>🍉</b>수박<br>'+state.items["🍉"]+'개</div><div class="item"><b>🍮</b>푸딩<br>'+state.items["🍮"]+'개</div><div class="item"><b>🧸</b>인형<br>'+state.items["🧸"]+'개</div></div>';choices=[["🧺 닫기",closePanel]]}
 $("sheetTitle").textContent=title;$("sheetDesc").textContent=desc;
 if(type!=="bag")$("dialog").textContent=type==="talk"?d.talk[0]:"";
 $("choices").innerHTML="";
 choices.forEach(([t,f])=>{const b=document.createElement("button");b.className="choice";b.textContent=t;b.onclick=f;$("choices").appendChild(b)});
 $("sheet").classList.add("open");
}
function closePanel(){$("sheet").classList.remove("open")}
function act(text,n){const s=state.chars[selected];state.love=Math.min(100,state.love+n);s.energy=Math.max(0,s.energy-2);bubble(selected,text);$("dialog").textContent=text;state.quest++;save();toast("마음이 가까워졌어요 💗")}
function eat(food,cost,text,n){
 if(state.coin<cost){toast("코인이 부족해요 🥺");return}
 if(state.items[food]<=0){toast("소지품이 다 떨어졌어요!");return}
 state.coin-=cost;state.items[food]--;state.love=Math.min(100,state.love+n);state.chars[selected].hunger=Math.min(100,state.chars[selected].hunger+25);bubble(selected,text);$("dialog").textContent=text;state.quest++;save();toast(food+"을(를) 냠냠 먹었어요");moveChar(selected,"69%","45%",()=>moveChar(selected,state.chars[selected].spot[0],state.chars[selected].spot[1]));
}
function play(text,n){const s=state.chars[selected];s.energy=Math.max(0,s.energy-8);state.love=Math.min(100,state.love+n);bubble(selected,text);state.quest++;save();toast("즐거운 시간이었어요 🎈")}
function sleepSelected(){
 const s=state.chars[selected]; sleeping[selected]=!sleeping[selected];
 const c=[...document.querySelectorAll(".char")].find(x=>x.dataset.name===selected);c.classList.toggle("sleeping",sleeping[selected]);
 if(sleeping[selected]){bubble(selected,"잘 자… 💤");toast(selected+"가 잠들었어요");}
 else{s.energy=Math.min(100,s.energy+30);bubble(selected,"일어났어! ☀️");toast(selected+"가 개운하게 일어났어요")}
 $("sleepLabel").textContent=sleeping[selected]?"깨우기":"재우기";save();
}
function toggleFan(){fan=!fan;$("wind").classList.toggle("on",fan);$("fanBadge").classList.toggle("show",fan);$("fanLabel").textContent=fan?"끄기":"선풍기";document.querySelectorAll(".char").forEach(c=>c.classList.toggle("windy",fan));toast(fan?"선풍기를 켰어요! 🍃":"선풍기를 껐어요");if(fan)eventMsg("선풍기에서 바람이 솔솔~")}
$("fan").onclick=toggleFan;
$("windowHot").onclick=()=>{toast("창문으로 시원한 바람이 들어와요 🍃");$("weather").textContent="🍃 창문이 열렸어요 · 바람이 솔솔";$("wind").classList.add("on");state.quest++;save();setTimeout(()=>{if(!fan)$("wind").classList.remove("on")},3000)}
$("fridgeHot").onclick=()=>openPanel("food");
$("bathHot").onclick=()=>openPanel("bath");
$("bookHot").onclick=()=>{bubble(selected,"책 읽고 있었어!");state.chars[selected].energy=Math.min(100,state.chars[selected].energy+3);save();toast(selected+"가 책을 읽고 있었어요 📖")};

function wander(){
 document.querySelectorAll(".char").forEach(c=>{
  const n=c.dataset.name;if(sleeping[n])return;
  const s=state.chars[n], list=spots[n];
  let spot=list[Math.floor(Math.random()*list.length)];
  // needs affect behavior
  if(s.hunger<35) spot=["69%","45%"];
  else if(s.energy<30) spot=["42%","62%"];
  moveChar(n,spot[0],spot[1]);
  if(Math.random()<.35)bubble(n,n==="우사기"?"와하!":n==="하치와레"?"「여기 햇빛 예쁘다!」":"「바람 좋다…」");
 });
}
setInterval(wander,4200);
setInterval(()=>{if(!fan){$("wind").classList.add("on");setTimeout(()=>{if(!fan)$("wind").classList.remove("on")},1600)}},9000);

document.querySelectorAll(".char").forEach(c=>c.style.left=state.chars[c.dataset.name].spot[0]);
document.querySelectorAll(".char").forEach(c=>c.style.top=state.chars[c.dataset.name].spot[1]);
selectChar(selected);save();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
